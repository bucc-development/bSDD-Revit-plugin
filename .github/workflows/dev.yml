#dev.yml

name: Compile and run tests
on:
  push:
    # this will cause the action to run on pushes to branches that start with the prefixes specified here
    branches: [ dev ]
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

  pull_request:
    # we'll also run this when pull requests to dev are opened
    branches: [ dev ]

jobs:
  Build:
    # The type of runner that the job will run on
    runs-on: windows-latest
    env:
      Solution_Name: BsddRevitPlugin.sln
    outputs:
      Version: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # install and calculate the new version with GitVersion  
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: '5.12.0'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v0.10.2
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml
        
        id: gitversion # step id used as reference for output values
      - name: Display GitVersion outputs
        run: |
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "NuGetVersionV2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"   
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"    


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # All dependencies (Revit API, CefSharp, WebView2) come from NuGet, so the full set builds on a
      # hosted runner without Revit installed. Each version project transitively builds the shared libs.
      - name: Build all Revit version projects
        run: |
          dotnet build BsddRevitPlugin.2024/BsddRevitPlugin.2024.csproj -c Release -p:Platform=x64
          dotnet build BsddRevitPlugin.2025/BsddRevitPlugin.2025.csproj -c Release -p:Platform=x64
          dotnet build BsddRevitPlugin.2026/BsddRevitPlugin.2026.csproj -c Release -p:Platform=x64